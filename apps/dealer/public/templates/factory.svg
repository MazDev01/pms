<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 160" width="480" height="160" role="img" aria-label="โรงงาน">
  <!-- ภาพลายเส้นชั่วคราว (ไม่ใช่ภาพถ่ายผลงานจริง) — แทนที่ได้ที่ /hq/master → แก้ไข → อัปโหลดรูป -->
  <defs>
    <pattern id="fg" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M22 0H0v22" fill="none" stroke="#003366" stroke-opacity=".07" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="480" height="160" fill="#f0f4f9"/>
  <rect width="480" height="160" fill="url(#fg)"/>
  <g fill="none" stroke="#003366" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round">
    <!-- หลังคาฟันเลื่อย (sawtooth) — ช่องแสงเหนือศีรษะ เอกลักษณ์โรงงานผลิต -->
    <path d="M84 78V54l36 18V48l36 18V42l36 18V78" stroke-width="3"/>
    <path d="M84 78h144v44H84z"/>
    <!-- ช่วงเสากว้าง + คานรับเครน -->
    <path d="M252 122V64h144v58" stroke-width="3"/>
    <path d="M252 82h144" stroke-width="1.6" stroke-opacity=".55"/>
    <!-- รอกเครนวิ่งบนคาน -->
    <rect x="310" y="82" width="28" height="12" rx="2"/>
    <path d="M324 94v14" stroke-width="1.6"/>
    <path d="M316 108h16" stroke-width="2.4"/>
    <!-- ปล่องระบายอากาศ -->
    <path d="M276 64V40h14v24" />
    <!-- หน้าต่างโรงงาน -->
    <path d="M104 96h32v18h-32zM160 96h32v18h-32z" stroke-width="1.6"/>
    <path d="M64 122h352" stroke-width="3"/>
  </g>
</svg>
