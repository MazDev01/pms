<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 160" width="480" height="160" role="img" aria-label="งานรีโนเวท">
  <!-- ภาพลายเส้นชั่วคราว (ไม่ใช่ภาพถ่ายผลงานจริง) — แทนที่ได้ที่ /hq/master → แก้ไข → อัปโหลดรูป -->
  <defs>
    <pattern id="rg" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M22 0H0v22" fill="none" stroke="#003366" stroke-opacity=".07" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="480" height="160" fill="#f0f4f9"/>
  <rect width="480" height="160" fill="url(#rg)"/>
  <g fill="none" stroke-linejoin="round" stroke-linecap="round">
    <!-- อาคารเดิม (เส้นทึบ) -->
    <g stroke="#003366" stroke-width="2.4">
      <path d="M120 66 216 44l96 22" stroke-width="3"/>
      <path d="M120 66v56h192V66" stroke-width="3"/>
      <rect x="148" y="88" width="44" height="34" rx="2"/>
      <path d="M240 88h44v18h-44z" stroke-width="1.6"/>
    </g>
    <!-- ส่วนต่อเติมใหม่ (เส้นประ) — สื่อว่า "เพิ่มของใหม่บนของเดิม" ไม่ใช่สร้างใหม่ทั้งหลัง -->
    <g stroke="#0891b2" stroke-width="2.4" stroke-dasharray="6 4">
      <path d="M312 122V80h72v42"/>
      <path d="M312 80h72"/>
      <rect x="330" y="94" width="20" height="12" rx="1" stroke-width="1.6"/>
    </g>
    <!-- หลังคาใหม่ทับของเดิม (เส้นประ) -->
    <path d="M112 70 216 46l104 24" stroke="#0891b2" stroke-width="2.2" stroke-dasharray="6 4" fill="none"/>
    <path d="M64 122h352" stroke="#003366" stroke-width="3" fill="none"/>
  </g>
</svg>
