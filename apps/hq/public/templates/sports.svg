<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 160" width="480" height="160" role="img" aria-label="สนามกีฬาในร่ม">
  <!-- ภาพลายเส้นชั่วคราว (ไม่ใช่ภาพถ่ายผลงานจริง) — แทนที่ได้ที่ /hq/master → แก้ไข → อัปโหลดรูป -->
  <defs>
    <pattern id="sg" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M22 0H0v22" fill="none" stroke="#003366" stroke-opacity=".07" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="480" height="160" fill="#f0f4f9"/>
  <rect width="480" height="160" fill="url(#sg)"/>
  <g fill="none" stroke="#003366" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round">
    <!-- หลังคาโค้งช่วงกว้าง ไม่มีเสากลาง เพดานสูง -->
    <path d="M88 122V88a152 152 0 0 1 304 0v34" stroke-width="3"/>
    <!-- โครงถักภายใน — สื่อว่าช่วงกว้างไม่มีเสาขวาง -->
    <path d="M112 78a128 128 0 0 1 256 0" stroke-width="1.4" stroke-opacity=".5"/>
    <path d="M150 58v12M200 46v12M240 42v12M280 46v12M330 58v12" stroke-width="1.4" stroke-opacity=".5"/>
    <!-- สนามด้านใน + เส้นแบ่งกลาง -->
    <path d="M150 122v-16h180v16" stroke-width="1.8"/>
    <path d="M240 106v16" stroke-width="1.4" stroke-opacity=".6"/>
    <!-- ทางเข้า -->
    <path d="M88 122v-18h24v18M368 122v-18h24v18" stroke-width="1.8"/>
    <path d="M64 122h352" stroke-width="3"/>
  </g>
</svg>
