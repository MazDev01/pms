<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 160" width="480" height="160" role="img" aria-label="งานตามแบบของลูกค้า">
  <!-- ภาพลายเส้นชั่วคราว (ไม่ใช่ภาพถ่ายผลงานจริง) — แทนที่ได้ที่ /hq/master → แก้ไข → อัปโหลดรูป -->
  <defs>
    <pattern id="cg" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M22 0H0v22" fill="none" stroke="#003366" stroke-opacity=".07" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="480" height="160" fill="#f0f4f9"/>
  <rect width="480" height="160" fill="url(#cg)"/>
  <g fill="none" stroke="#003366" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round">
    <!-- อาคารผสมผสาน: ทรงไม่ซ้ำแบบมาตรฐาน = ออกแบบเฉพาะโครงการ -->
    <path d="M120 122V76l44-26 44 26v46" stroke-width="3"/>
    <path d="M208 122V92h60v30" stroke-width="3"/>
    <path d="M268 122V64l44 22v36" stroke-width="3"/>
    <!-- เส้นบอกแนว (dimension line) — สื่อว่าปรับผัง/ช่องเปิดได้ตามแบบ -->
    <g stroke-width="1.4" stroke-opacity=".6" stroke-dasharray="5 4">
      <path d="M120 44h88"/>
      <path d="M120 38v12M208 38v12" stroke-dasharray="0"/>
    </g>
    <!-- ช่องเปิดที่ปรับได้ -->
    <g stroke-width="1.6" stroke-dasharray="4 3">
      <rect x="140" y="92" width="20" height="14" rx="1"/>
      <rect x="172" y="92" width="20" height="14" rx="1"/>
      <rect x="226" y="102" width="24" height="20" rx="1"/>
    </g>
    <path d="M64 122h352" stroke-width="3"/>
  </g>
</svg>
