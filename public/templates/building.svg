<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 160" width="480" height="160" role="img" aria-label="อาคารสำเร็จรูปทุกประเภท">
  <!-- ภาพลายเส้นชั่วคราว (ไม่ใช่ภาพถ่ายผลงานจริง) — แทนที่ได้ที่ /hq/master → แก้ไข → อัปโหลดรูป -->
  <defs>
    <pattern id="bg" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M22 0H0v22" fill="none" stroke="#003366" stroke-opacity=".07" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="480" height="160" fill="#f0f4f9"/>
  <rect width="480" height="160" fill="url(#bg)"/>
  <g fill="none" stroke="#003366" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round">
    <!-- อาคาร 3 ชั้น — ปรับผังได้หลายรูปแบบ (สำนักงาน/โรงเรียน/สถานพยาบาล) -->
    <path d="M150 122V52h116v70" stroke-width="3"/>
    <path d="M150 52h116" stroke-width="3"/>
    <!-- เส้นแบ่งชั้น -->
    <path d="M150 76h116M150 100h116" stroke-width="1.4" stroke-opacity=".55"/>
    <!-- หน้าต่างเรียงเป็นตาราง -->
    <g stroke-width="1.6">
      <rect x="164" y="60" width="20" height="10" rx="1"/><rect x="196" y="60" width="20" height="10" rx="1"/><rect x="228" y="60" width="20" height="10" rx="1"/>
      <rect x="164" y="84" width="20" height="10" rx="1"/><rect x="196" y="84" width="20" height="10" rx="1"/><rect x="228" y="84" width="20" height="10" rx="1"/>
    </g>
    <!-- ทางเข้ากระจก -->
    <path d="M196 122v-14h24v14" stroke-width="2"/>
    <!-- ปีกอาคารชั้นเดียว — ต่อขยายผังได้ -->
    <path d="M266 122V84h64v38" />
    <path d="M266 84h64" stroke-width="2.4"/>
    <g stroke-width="1.6"><rect x="282" y="94" width="16" height="10" rx="1"/><rect x="306" y="94" width="16" height="10" rx="1"/></g>
    <path d="M64 122h352" stroke-width="3"/>
  </g>
</svg>
