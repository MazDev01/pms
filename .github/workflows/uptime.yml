# ── เฝ้าระวังว่าเว็บยังใช้งานได้ · แจ้งเตือนอัตโนมัติเมื่อล่ม ──────────────────────
#
# ทำไมต้องมี: ถ้าไม่มีตัวเฝ้าระวัง จะรู้ว่าระบบล่มก็ต่อเมื่อผู้ใช้โทรมาแจ้ง
#   ซึ่งกลางดึกหรือวันหยุดแปลว่าล่มค้างเป็นชั่วโมงโดยไม่มีใครรู้
#
# แจ้งเตือนยังไง: งานนี้ "ตก" เมื่อเว็บไม่ไหว แล้ว GitHub ส่งอีเมลหาเจ้าของ repo ให้เอง
#   ไม่ต้องสมัครบริการเสริม ไม่ต้องตั้งค่าอะไรเพิ่ม
#   ถ้าอยากให้เข้าไลน์/Slack ด้วย เพิ่ม step ยิง webhook ต่อท้ายได้
#
# ⚠️ ยิงเฉพาะ "เว็บใช้งานจริง" เท่านั้น ห้ามใส่เว็บตัวอย่าง (demo)
#   เว็บตัวอย่างตั้งใจไม่ต่อฐานข้อมูล จุดเช็กสุขภาพจึงตอบว่า "ไม่ไหว" เป็นปกติ
#   ใส่ไปจะเตือนผิดทุก 10 นาทีจนไม่มีใครอ่านอีกเลย
#
# วิธีเปิดใช้: ตั้งค่าตัวแปรของ repo (Settings › Secrets and variables › Actions › Variables)
#   HQ_HEALTH_URL     = https://<เว็บสำนักงานใหญ่จริง>/api/health
#   DEALER_HEALTH_URL = https://<เว็บตัวแทนจริง>/api/health
# ถ้ายังไม่ได้ตั้ง งานนี้จะข้ามไปเฉย ๆ ไม่ตก (ยังไม่มีเว็บจริงให้เฝ้า)
name: เฝ้าระวังเว็บ

on:
  schedule:
    - cron: "*/10 * * * *"   # ทุก 10 นาที
  workflow_dispatch:          # กดตรวจเดี๋ยวนี้ได้เอง

jobs:
  uptime:
    name: เช็กว่าเว็บยังไหว
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: ยิงถามจุดเช็กสุขภาพ
        env:
          HQ: ${{ vars.HQ_HEALTH_URL }}
          DEALER: ${{ vars.DEALER_HEALTH_URL }}
        run: |
          set -u
          # ⚠️ ชื่อตัวแปรต้องเป็นอังกฤษ — bash ใช้ชื่อตัวแปรภาษาไทยไม่ได้ (เจอจริง 26 ส.ค. 69)
          if [ -z "${HQ}" ] && [ -z "${DEALER}" ]; then
            echo "ยังไม่ได้ตั้งที่อยู่เว็บจริง — ข้ามการตรวจ (ดูวิธีเปิดใช้ในหัวไฟล์นี้)"
            exit 0
          fi
          BAD=0
          for pair in "สำนักงานใหญ่|${HQ}" "ตัวแทน|${DEALER}"; do
            LABEL="${pair%%|*}"; url="${pair#*|}"
            [ -z "$url" ] && continue
            # ลอง 3 ครั้ง ห่างกัน 20 วินาที — เน็ตสะดุดชั่วครู่ไม่ควรปลุกคนทั้งทีม
            OK=0
            for i in 1 2 3; do
              # ล้างไฟล์คำตอบก่อนทุกครั้ง — ถ้ายิงไม่ติด curl จะไม่เขียนทับ แล้วเราจะเผลอ
              # พิมพ์คำตอบของเว็บก่อนหน้าออกมาเป็นหลักฐานผิดตัว (เจอจริงตอนทดสอบ 26 ส.ค. 69)
              rm -f /tmp/body.json
              code=$(curl -s -o /tmp/body.json -w "%{http_code}" --max-time 20 "$url") || code="ยิงไม่ติด"
              if [ "$code" = "200" ]; then OK=1; break; fi
              echo "  $LABEL ครั้งที่ $i ได้รหัส $code"
              [ $i -lt 3 ] && sleep 20
            done
            if [ "$OK" = "1" ]; then
              echo "$LABEL ปกติ"
            else
              echo "::error::$LABEL ใช้งานไม่ได้ ($url ตอบ $code)"
              [ -f /tmp/body.json ] && head -c 400 /tmp/body.json
              BAD=1
            fi
          done
          exit $BAD
